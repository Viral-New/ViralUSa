<script type='text/javascript'>
(function () {

  /* =========================
     IMPRESSION TAGGING
  ========================= */
  const impressionSeen = new Set();

  function tagImpression(name, element) {
    if (!element || impressionSeen.has(name)) return;
    impressionSeen.add(name);

    try {
      const key = "nextwatch_impressions";
      const data = JSON.parse(localStorage.getItem(key) || "[]");

      data.push({
        event: name,
        time: new Date().toISOString(),
        page: location.href
      });

      localStorage.setItem(
        key,
        JSON.stringify(data.slice(-100))
      );
    } catch (e) {}

    element.setAttribute(
      "data-impression-tagged",
      "true"
    );
  }

  tagImpression("page_impression", document.body);

  const videoCard = document.querySelector(".video-card");
  const adCard = document.querySelector(".ads-card");

  if ("IntersectionObserver" in window) {

    const observer = new IntersectionObserver((entries) => {

      entries.forEach(entry => {

        if (
          !entry.isIntersecting ||
          entry.intersectionRatio < 0.25
        ) return;

        if (entry.target === videoCard) {
          tagImpression(
            "video_impression",
            entry.target
          );
        }

        if (entry.target === adCard) {
          tagImpression(
            "native_banner_impression",
            entry.target
          );
        }

        observer.unobserve(entry.target);

      });

    }, {
      threshold: [0.25]
    });

    if (videoCard) observer.observe(videoCard);
    if (adCard) observer.observe(adCard);

  } else {

    tagImpression("video_impression", videoCard);
    tagImpression(
      "native_banner_impression",
      adCard
    );

  }

  /* =========================
     SMARTLINK
  ========================= */
  const smartlink =
    "https://www.facebook.com/janoub.lebnan/";

  /* =========================
     VIDEO PARAM
  ========================= */
  const params =
    new URLSearchParams(window.location.search);

  let video = params.get("v");

  if (!video) {
    video = "oHZxIRfl1";
  }

  if (!video.startsWith("http")) {
    video = "https://cdn.videy.co/" + video;
  }

  if (!video.endsWith(".mp4")) {
    video += ".mp4";
  }

  const player =
    document.getElementById("player");

  const source =
    document.getElementById("videoSource");

  const loader =
    document.getElementById("videoLoader");

  source.src = video;

  player.load();

  setTimeout(function () {

    loader.style.display = "none";

    player.play().catch(() => {});

  }, 1000);

  player.addEventListener(
    "contextmenu",
    e => e.preventDefault()
  );

})();
</script>
